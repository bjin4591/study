<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliana's ISEE Prep</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

       body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            color: #333;
        }

        h1 {
            color: #d9383a;
            font-size: 24px;
            font-style: italic;
            margin-bottom: 20px;
        }

        /* To Do styling */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .todo-container {
            border: 2px solid #0099ff;
            padding: 8px 15px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }

        .todo-label {
            color: #d9383a;
            font-weight: bold;
            margin-right: 5px;
        }
        .radio-todo-label {
            color: #2b3bb5;
            font-size: 14px;
            //font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

    /* Container layout styling */

    .subjects {
        font-family: Arial, sans-serif;
        margin: 20px 0;
    }

    .subject-category {
        font-size: 1.1rem;
        font-weight: bold;
        color: #d9383a;
        margin-bottom: 20px;
    }

    .subject-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-left: 20px;
        margin-bottom: 20px;
        color: #0066cc;
        text-decoration: underline double;
    }

    .subject-list {
        display: flex;
        flex-direction: column;
        gap: 10px; 
        padding-left: 50px;
    }

    .subject-link {
        color: #0066cc;
        text-decoration: none; /* Removes the underline */
        font-size: 1rem;
        width: fit-content;
        transition: color 0.2s ease;
    }

    /* Subtle hover effect */
    .subject-link:hover {
        color: #004499;
        text-decoration: underline; /* Shows underline only on hover for clarity */
    }
</style>
</head>

<body>

    <h1 style="margin-bottom: 40px;">Eliana's Drinking the ISEE</h1>
    
        <!-- Top Parameter Bar -->
        <div class="top-bar">
            <div class="todo-container">
                <span class="todo-label">To Do:</span>
                <label class="radio-todo-label">
                    <input type="radio" name="todo" value="1"> New
                </label>
                <label class="radio-todo-label">
                    <input type="radio" name="todo" value="2"> Wait
                </label>
                <label class="radio-todo-label">
                    <input type="radio" name="todo" value="3" checked> New + Wait
                </label>
                <label class="radio-todo-label">
                    <input type="radio" name="todo" value="4"> Done
                </label>
                <label class="radio-todo-label">
                    <input type="radio" name="todo" value="5"> All
                </label>
            </div>
        </div>

  <div class="subjects">

    <div class="subject-category">Quantitative Reasoning & Math Achievement</div>
    
    <div class="subject-group">Numbers & Operations</div>
      <div class="subject-list">
        <a href="#" class="subject-link" onclick="navigateToQuiz(event, 'tvqp', 1)">Place Values </a>
        <a href="#" class="subject-link" onclick="navigateToQuiz(event, 'tvqp', 4)">Comparing Percents, Fractions & Decimals </a>
        <a href="#" class="subject-link" onclick="navigateToQuiz(event, 'tvqp', 5)">Word Problems </a>
        <a href="#" class="subject-link" onclick="navigateToQuiz(event, 'tvqp', 6)">Word Problems with Fractions & Decimals </a>
      </div>
    </div>

<script>
function navigateToQuiz(event, cat, grp) {
    event.preventDefault();
    
    // Find the currently selected radio button for 'todo'
    const selectedRadio = document.querySelector('input[name="todo"]:checked');
    const todoValue = selectedRadio ? selectedRadio.value : '';
    
    // Dynamically grab the current protocol (http: or https:) and host (domain + port)
    const currentProtocol = window.location.protocol; 
    const currentHost = window.location.host;    
    
    // Construct the fully dynamic URL
    const targetUrl = `${currentProtocol}//${currentHost}/study/main.html?cat=${cat}&grp=${grp}&todo=${todoValue}`;
    
    window.location.href = targetUrl;
}
</script>

</body>
</html>
